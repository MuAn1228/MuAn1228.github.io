name: Update Contributions & Deploy

on:
  push:
    branches: [main]     # 推送 main 自动部署
  schedule:
    - cron: '17 0 * * *'  # 每天 UTC 00:17（北京时间 08:17）
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch GitHub contributions
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: python fetch_contributions.py

      - name: Build
        run: npx hexo generate

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./public

      # Artifact metadata can lag behind a completed upload. Separate attempts
      # also need distinct names so a rerun cannot select an older artifact.
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            count=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" --jq '.artifacts | map(select(.expired == false)) | length')
            if [ "$count" = "1" ]; then
              echo "Pages artifact is available."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Expected one Pages artifact after upload; metadata is not ready."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
