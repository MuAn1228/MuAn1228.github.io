# ============================================================
#  Butterfly 主题美化配置
#  此文件与主题默认配置合并、优先级更高；改动后执行 hexo clean
# ============================================================

# ---------- 默认显示模式（打开即夜间模式；按钮仍可切换回浅色） ----------
display_mode: dark

# ---------- 导航菜单 ----------
menu:
  首页: / || fas fa-home
  旅行: /travel/ || fas fa-map-marked-alt
  娱乐||fas fa-gamepad:
    音乐: /fun/music/ || fas fa-music
    电影: /fun/movies/ || fas fa-film
    游戏: /fun/games/ || fas fa-gamepad
    阅读: /fun/books/ || fas fa-book
    小游戏: /fun/arcade/ || fas fa-puzzle-piece
  展示: /showcase/ || fas fa-id-card
  交易: /finance/ || fas fa-chart-line
  分类: /categories/ || fas fa-folder-open
  关于本站: /about-site/ || fas fa-info-circle
  私密: /private/ || fas fa-lock

# ---------- 头像（旋转动画） ----------
avatar:
  img: /img/avatar.png
  effect: false

# ---------- 站点图标与背景 ----------
favicon: /img/avatar.png
background: '#eef4fb'

# ---------- 社交链接 ----------
social:
  fab fa-github: 'https://github.com/MuAn1228 || Github || #24292e'
  fas fa-envelope: 'mailto:libohang1228@163.com || Email || #4a7dbe'
  fab fa-qq: 'https://wpa.qq.com/msgrd?v=3&uin=1420482988&site=qq&menu=yes || QQ || #12B7F5'
  fab fa-weixin: 'https://weixin.qq.com/ || 微信 lbh071031 || #07C160'
  fab fa-zhihu: 'https://www.zhihu.com/people/tian-tian-19-45-51 || 知乎 || #0084FF'
  fab fa-bilibili: 'https://space.bilibili.com/424086446 || B站 || #FB7299'
  fab fa-tiktok: 'https://www.douyin.com/ || 抖音 lbh071031 || #25F4EE'

# ---------- 搜索 ----------
search:
  use: local_search
  placeholder: 搜索文章...

# ---------- 个性化设置 ----------
aside:
  position: left
  card_author:
    description: gcc blissful_life.c -o blissful_life
    button:
      link: https://github.com/MuAn1228
  card_announcement:
    content: Computer Science,Nasdaq 100,Independent developer
  card_webinfo:
    runtime_date: '2026/08/15'

footer:
  owner:
    since: 2026
  custom_text: 记录技术，也记录生活

# ---------- 首页副标题（打字机效果） ----------
subtitle:
  enable: true
  effect: true
  source: false
  typed_option:
    loop: true
    typeSpeed: 100
    backSpeed: 60
  sub:
    - 梦想是和喜欢的人在杭州度过余生。
    - 山高万仞，只登一步
    - 好，说的好，我完全同意。
    - 嘉豪是个真正的黑客，起码他成功入侵了我的青春
    - 能活出最真实的自我是一种最高级的奢侈
    - 思想需要容器，不然就会蒸发
    - 作为小县城里唯一认识铵根的人，我的眼神里总是透露着一股同龄人之间所没有的忧郁

# ---------- 加载动画 ----------
preloader:
  enable: true
  source: 1

# ---------- 打字粒子特效 ----------
activate_power_mode:
  enable: true
  colorful: true
  shake: false
  mobile: false

# ---------- 背景粒子连线 ----------
canvas_nest:
  enable: false
  color: '0,150,255'
  opacity: 0.6
  zIndex: -1
  count: 99
  mobile: false

# ---------- 点击特效（粉色爱心 NH₄⁺ + 核心价值观文字） ----------
fireworks:
  enable: false
  zIndex: 9999
  mobile: false

clickShowText:
  enable: false

# ---------- 图片灯箱与数学公式 ----------
lightbox: fancybox

math:
  use: katex
  per_page: true

# ---------- 注入自定义特效 ----------
inject:
  head:
    - '<link rel="stylesheet" href="/css/custom.css">'
    - '<link rel="stylesheet" href="/css/sakana.css">'
    - '<link rel="stylesheet" href="/lib/APlayer.min.css">'
    - '<link rel="preload" href="/lib/live2d/waifu.css" as="style" onload="this.rel=stylesheet">'
  bottom:
    - '<script src="/js/device-guard.js"></script>'
    - '<script src="/js/sakura.js"></script>'
    - '<script src="/js/click-effect.js"></script>'
    - '<script src="/js/live2d.js"></script>'
    - '<script src="/js/sakana-physics.js"></script>'
    - '<script src="/js/sakana-widget.js"></script>'
    - '<script src="/js/pjax-prefetch.js"></script>'
    - '<script src="/js/visitor-count.js"></script>'
    - '<script src="/js/typing.js"></script>'
    - '<script src="/js/github-stats.js"></script>'
    - '<script src="/js/music-toggle.js"></script>'
    - '<script src="/js/reward-lightbox.js"></script>'
    - '<script src="/js/name-particles.js"></script>'
    - '<script src="/js/page-assets.js"></script>'
    

# ---------- 评论系统（Giscus） ----------
comments:
  use:
    - Giscus

giscus:
  repo: MuAn1228/MuAn1228.github.io
  repo_id: R_kgDORtelHg
  category_id: DIC_kwDORtelHs4DDYVx

# ---------- 打赏（赞赏）已移到首页侧边栏，文章页关闭 ----------
reward:
  enable: false
  text: 打赏
  QR_code:
    - img: /img/reward-wechat.webp
      text: 微信
    - img: /img/reward-alipay.webp
      text: 支付宝

# ---------- 主题色（紫色系，替换默认蓝） ----------
theme_color:
  enable: true
  main: "#8e6bb5"
  paginator: "#8e6bb5"
  button_hover: "#5c4a7d"
  text_selection: "#b79ad6"
  link_color: "#8e6bb5"
  meta_color: "#858585"
  hr_color: "#b79ad6"
  code_foreground: "#8e6bb5"
  code_background: "rgba(142, 124, 181, .08)"
  toc_color: "#8e6bb5"
  blockquote_padding_color: "#8e6bb5"
  blockquote_background_color: "#8e6bb5"
  scrollbar_color: "#8e6bb5"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

# ---------- 文章图片懒加载（native，build 时给 post 内 <img> 加 loading="lazy"） ----------
# 解决长文章多图首屏一次性拉取卡顿：文本先渲染，图片随滚动加载
lazyload:
  enable: true
  native: true
  field: post
  placeholder:

# ---------- Umami 分析（自建 Railway 实例；token 已失效(2026-08-26 返回 401) ----------
# 访客数/浏览数已改用不蒜子 busuanzi（webinfo 显示），Umami 仅保留访问上报
umami_analytics:
  enable: true
  serverURL: https://umami-production-7c80.up.railway.app
  script_name: script.js
  website_id: 33be0901-0df7-4b3c-819c-3a3438904af8
  option: {}
  UV_PV:
    page_uv: false
    site_uv: false
    site_pv: false
    token: ''
